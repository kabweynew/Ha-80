<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner Console</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Owner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#f1f5f9; --dim:#94a3b8; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .dim { color:var(--dim); font-size:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:14px; }
  .tab.on { background:var(--blue); border-color:var(--blue); }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:16px; }
  button.act { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:13px; }
  button.go { width:100%; margin-top:10px; padding:12px; border-radius:10px; border:0; background:var(--blue); color:#fff; font-size:16px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; text-align:center; }
  .stats b { display:block; font-size:18px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .err { border-left:3px solid var(--red); }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; }
  .coname { display:inline-block; font-family:'Playfair Display',Georgia,'Times New Roman',serif; font-weight:800; line-height:1.15; letter-spacing:.4px; word-break:break-word;
            background:linear-gradient(90deg,#ffffff 0%,var(--co2,#60a5fa) 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
            filter:drop-shadow(0 2px 8px rgba(0,0,0,.35)); }
  .cosub { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); margin-top:4px; }
  #msg { color:var(--red); font-size:13px; margin-top:8px; min-height:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="lock">
    <h1>🛡️ Owner Console</h1>
    <div class="card">
      <div class="dim" id="hint" style="margin-bottom:8px">Enter your private setup code</div>
      <input id="code" type="password" autocomplete="off" placeholder="Setup code">
      <input id="code2" type="password" autocomplete="off" placeholder="Repeat setup code" style="display:none;margin-top:8px">
      <button class="go" id="enter">Open</button>
      <button class="go" id="bio" style="display:none;background:#10b981">🔐 Unlock with fingerprint / face</button>
      <div id="msg"></div>
    </div>
  </div>
  <div id="main" style="display:none">
    <div class="row"><h1>🛡️ Owner Console</h1><div style="display:flex;gap:6px"><button class="act" id="bioSet" title="Fingerprint / face unlock on this device">🔐 Off</button><button class="act" id="refresh">↻ Refresh</button></div></div>
    <div class="tabs">
      <button class="tab on" data-t="companies">Companies</button>
      <button class="tab" data-t="live">Live</button>
      <button class="tab" data-t="errors">Problems</button>
    </div>
    <div id="companies"></div>
    <div id="usersView" style="display:none"></div>
    <div id="designView" style="display:none"></div>
    <div id="live" style="display:none"></div>
    <div id="errors" style="display:none"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, setDoc, getDocs, onSnapshot, query, orderBy, limit, getCountFromServer, deleteField, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDlMIQekGsMTZlPqNWddeL2tqPwNCknetg",
  authDomain: "haaa-3b06e.firebaseapp.com",
  projectId: "haaa-3b06e",
  storageBucket: "haaa-3b06e.firebasestorage.app",
  messagingSenderId: "172639268578",
  appId: "1:172639268578:web:ab7b25bab6bca71e33b8bb"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const LEGACY = 'haaa';
const ONLINE_MS = 150000; // a session is "online" if it reported in the last 2.5 minutes

let companies = [{ id: LEGACY, name: 'WKABE', sub: 'Hask Services — Djibouti' }];
let status = {}, presence = [], errors = [], counts = {}, themes = {};

const sha256 = async t => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))).map(x => x.toString(16).padStart(2, '0')).join('');
const el = (tag, css, text) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (text !== undefined) e.textContent = text; return e; };
const path = (id, name) => id === LEGACY ? [name] : ['companies', id, name];
const ago = ts => { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const isOn = p => p.online && Date.now() - p.lastSeen < ONLINE_MS;

let firstTime = false;
(async () => { try { firstTime = !(await getDoc(doc(db, 'appConfig', 'setup'))).exists();
  if (firstTime) { $('code2').style.display = 'block'; $('enter').textContent = 'Create code & open'; $('hint').textContent = 'First time: create your private setup code (at least 8 characters, keep it secret).'; } } catch (e) {}
  refreshBioUI();
  if (!firstTime && bioSupported() && getBio()) setTimeout(async () => { if (await bioUnlock()) openConsole(); }, 400);
})();

$('enter').onclick = async () => {
  const msg = t => $('msg').textContent = t;
  try {
    const sref = doc(db, 'appConfig', 'setup');
    const code = $('code').value.trim();
    if (firstTime) {
      if (code.length < 8) return msg('Use at least 8 characters');
      if (code !== $('code2').value.trim()) return msg('Codes do not match');
      const salt = crypto.randomUUID(); await setDoc(sref, { salt, hash: await sha256(salt + code) });
    } else {
      const s = await getDoc(sref); const d = s.data();
      if (await sha256(d.salt + code) !== d.hash) return msg('Wrong code');
    }
    openConsole();
  } catch (e) { msg('Error: ' + (e.code || e.message)); }
};

// ── Fingerprint / face unlock (WebAuthn platform authenticator, this device only) ──
const BIO_KEY = 'ownerBioCred';
const getBio = () => { try { return localStorage.getItem(BIO_KEY); } catch (e) { return null; } };
const setBio = v => { try { v ? localStorage.setItem(BIO_KEY, v) : localStorage.removeItem(BIO_KEY); } catch (e) {} };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const bioSupported = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
function refreshBioUI() {
  $('bio').style.display = (!firstTime && bioSupported() && getBio()) ? 'block' : 'none';
  $('bioSet').textContent = getBio() ? '🔐 On' : '🔐 Off';
}
async function bioEnable() {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Owner Console', id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: 'Owner' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000 } });
    setBio(b64(cred.rawId)); return true;
  } catch (e) { alert('Fingerprint / face setup failed: ' + (e.name || e.message)); return false; }
}
async function bioUnlock() {
  try {
    const r = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname,
      allowCredentials: [{ id: unb64(getBio()), type: 'public-key', transports: ['internal'] }],
      userVerification: 'required', timeout: 60000 } });
    return !!r;
  } catch (e) { return false; }
}
let started = false;
function openConsole() {
  $('lock').style.display = 'none'; $('main').style.display = 'block';
  if (!started) { started = true; start(); }
  refreshBioUI();
}
$('bio').onclick = async () => { if (await bioUnlock()) openConsole(); else $('msg').textContent = 'Fingerprint / face check failed. Use your setup code.'; };
$('bioSet').onclick = async () => {
  if (!bioSupported()) return alert('This browser or device does not support fingerprint / face unlock (it needs HTTPS and a screen lock).');
  if (getBio()) { if (confirm('Turn off fingerprint / face unlock on this device?')) setBio(null); }
  else if (await bioEnable()) alert('Fingerprint / face unlock is ON for this device. Next time, tap the green button to open the console. Your setup code still works too.');
  refreshBioUI();
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('enter').click(); });

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['companies', 'live', 'errors'].forEach(t => $(t).style.display = t === b.dataset.t ? 'block' : 'none');
});
$('refresh').onclick = () => loadCounts();

async function start() {
  try {
    const c = await getDoc(doc(db, 'appConfig', 'companies'));
    const extra = c.exists() ? (c.data().list || []) : [];
    const m = {}; companies.concat(extra).forEach(x => m[x.id] = x); companies = Object.values(m);
  } catch (e) {}
  onSnapshot(doc(db, 'appConfig', 'companyStatus'), s => { status = s.exists() ? s.data() : {}; render(); });
  onSnapshot(doc(db, 'appConfig', 'companyThemes'), s => { themes = s.exists() ? s.data() : {}; render(); });
  onSnapshot(collection(db, 'presence'), s => { presence = s.docs.map(d => d.data()); render(); });
  onSnapshot(query(collection(db, 'errorLogs'), orderBy('ts', 'desc'), limit(60)), s => { errors = s.docs.map(d => d.data()); render(); });
  loadCounts();
  setInterval(render, 30000);
  setInterval(loadCounts, 120000);
}

async function loadCounts() {
  for (const c of companies) {
    counts[c.id] = counts[c.id] || {};
    try { counts[c.id].trucks = (await getCountFromServer(collection(db, ...path(c.id, 'trucks')))).data().count; } catch (e) { counts[c.id].trucks = '?'; }
    try { const w = await getDoc(doc(db, ...path(c.id, 'settings'), 'workers')); counts[c.id].workers = w.exists() ? (w.data().list || []).length : 0; } catch (e) { counts[c.id].workers = '?'; }
    try { counts[c.id].haskSet = c.id === LEGACY ? true : !!((await rawPins(c)).admin); } catch (e) { counts[c.id].haskSet = false; }
    try { counts[c.id].agSet = !!(await agCfg(c)); } catch (e) { counts[c.id].agSet = false; }
    if (counts[c.id].agSet) { try { counts[c.id].agTrucks = (await getCountFromServer(collection(db, ...path(c.id, 'kab_trucks')))).data().count; } catch (e) { counts[c.id].agTrucks = '?'; } }
  }
  render();
}

const LEGACY_DEFAULT_PINS = { admin:'2055', head:'2013', cashier1:'7777', cashier2:'8888', Ahmed:'1111', Oli:'3333' };
async function rawPins(c) {
  const path = c.id === LEGACY ? ['settings', 'pins'] : ['companies', c.id, 'settings', 'pins'];
  try { const s = await getDoc(doc(db, ...path)); return s.exists() ? s.data() : {}; } catch (e) { return {}; }
}
async function pinsOf(c) {   // only people who really exist: roles + current workers
  const d = await rawPins(c);
  let w = await workersOf(c);
  if (c.id === LEGACY && !w.length) w = ['Ahmed', 'Ilyas', 'Oli'];
  const valid = new Set(FIXED.map(x => x[0]).concat(w));
  const merged = c.id === LEGACY ? Object.assign({}, LEGACY_DEFAULT_PINS, d) : d;
  const out = {}; Object.keys(merged).forEach(u => { if (valid.has(u)) out[u] = merged[u]; });
  return out;
}
const AG_COLORS = ['#d97706', '#10b981', '#3b82f6', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316'];
const agRef = c => doc(db, ...(c.id === LEGACY ? ['kab_config', 'main'] : ['companies', c.id, 'kab_config', 'main']));
async function agCfg(c) { try { const s = await getDoc(agRef(c)); return s.exists() ? s.data() : null; } catch (e) { return null; } }
function agItems(cfg) {
  if (!cfg) return [];
  const out = [{ key: 'admin', label: 'Admin', pin: cfg.apin || '' }, { key: 'foreman', label: (cfg.foreman && cfg.foreman.name) || 'Foreman', pin: (cfg.foreman && cfg.foreman.pin) || '' }];
  (cfg.posts || []).forEach(p => out.push({ key: 'post:' + p.id, label: p.label, pin: p.pin || '' }));
  return out;
}
async function allAgashPins() {
  const all = [];
  for (const x of companies) agItems(await agCfg(x)).forEach(i => { if (i.pin) all.push({ cid: x.id, cname: x.name, key: i.key, label: i.label, pin: String(i.pin) }); });
  return all;
}
async function ensureAgashConfig(c, adminPin) {
  const cfg = await agCfg(c);
  if (cfg) return updateDoc(agRef(c), { apin: adminPin });
  return setDoc(agRef(c), { apin: adminPin, addingSuspended: false, arrimeurs: [],
    foreman: { pin: '', name: 'Foreman', perms: { viewTrucks: true, viewPosts: true, addTruck: false, editTruck: false, deleteTruck: false } },
    posts: AG_COLORS.map((col, i) => ({ id: 'p' + (i + 1), label: 'Post ' + (i + 1), pin: '', color: col })) });
}
async function setAgashPin(c, key, label) {
  const pin = (prompt('New Agash PIN for ' + label + ' at ' + c.name + ' (4 to 6 digits, unique across all companies):', '') || '').trim();
  if (!pin) return;
  if (!/^\d{4,6}$/.test(pin)) return alert('PIN must be 4 to 6 digits.');
  const clash = (await allAgashPins()).find(x => x.pin === pin && !(x.cid === c.id && x.key === key));
  if (clash) return alert('That PIN is already used by ' + clash.label + ' at ' + clash.cname + '. Choose another.');
  try {
    const cfg = await agCfg(c); if (!cfg) return alert('Agash is not set up for this company yet.');
    if (key === 'admin') await updateDoc(agRef(c), { apin: pin });
    else if (key === 'foreman') await updateDoc(agRef(c), { 'foreman.pin': pin });
    else { const posts = (cfg.posts || []).map(p => ('post:' + p.id === key) ? Object.assign({}, p, { pin }) : p); await updateDoc(agRef(c), { posts }); }
  } catch (e) { return alert('Could not save: ' + (e.code || e.message)); }
  openUsers(c);
}
async function askNewPin(text) {
  const pin = (prompt(text, '') || '').trim();
  if (!pin) return null;
  if (!/^\d{4,6}$/.test(pin)) { alert('PIN must be 4 to 6 digits.'); return null; }
  return pin;
}
async function setHaskAdminPin(c) {
  const pin = await askNewPin('HASK app admin PIN for ' + c.name + ' (4 to 6 digits, must be different from every other Hask PIN):');
  if (!pin) return;
  for (const x of companies) {
    const pins = await pinsOf(x);
    for (const u of Object.keys(pins)) if (String(pins[u]) === pin && !(x.id === c.id && u === 'admin')) return alert('That PIN is already used by someone in ' + x.name + ' (Hask). Choose another.');
  }
  try { await setDoc(doc(db, ...(c.id === LEGACY ? ['settings', 'pins'] : ['companies', c.id, 'settings', 'pins'])), { admin: pin }, { merge: true }); alert('Hask admin PIN saved for ' + c.name + '.'); }
  catch (e) { alert('Could not save: ' + (e.code || e.message)); }
  loadCounts();
}
async function setAgashAdminPin(c) {
  const pin = await askNewPin('AGASH app admin PIN for ' + c.name + ' (4 to 6 digits, must be different from every other Agash PIN):');
  if (!pin) return;
  const clash = (await allAgashPins()).find(x => x.pin === pin && !(x.cid === c.id && x.key === 'admin'));
  if (clash) return alert('That PIN is already used in Agash by ' + clash.label + ' at ' + clash.cname + '. Choose another.');
  try { await ensureAgashConfig(c, pin); alert('Agash admin PIN saved for ' + c.name + '.'); }
  catch (e) { alert('Could not save: ' + (e.code || e.message)); }
  loadCounts();
}
// random unique PIN for "reset"
async function freshPin() {
  const taken = new Set((await allPins()).map(x => x.pin)); (await allAgashPins()).forEach(x => taken.add(x.pin));
  for (let i = 0; i < 500; i++) { const p = String(Math.floor(1000 + Math.random() * 9000)); if (!taken.has(p)) return p; }
  return null;
}
async function resetUserPin(c, u, label) {
  if (!confirm('Reset the PIN of ' + label + ' at ' + c.name + ' (Hask)? A new random PIN is created and the old one stops working.')) return;
  const pin = await freshPin(); if (!pin) return alert('Could not find a free PIN.');
  try { await setDoc(doc(db, ...(c.id === LEGACY ? ['settings', 'pins'] : ['companies', c.id, 'settings', 'pins'])), { [u]: pin }, { merge: true }); }
  catch (e) { return alert('Could not save: ' + (e.code || e.message)); }
  alert('New PIN for ' + label + ' (Hask): ' + pin); openUsers(c);
}
async function resetAgashPin(c, key, label) {
  if (!confirm('Reset the PIN of ' + label + ' at ' + c.name + ' (Agash)? A new random PIN is created and the old one stops working.')) return;
  const pin = await freshPin(); if (!pin) return alert('Could not find a free PIN.');
  try {
    const cfg = await agCfg(c); if (!cfg) return alert('Agash is not set up for this company yet.');
    if (key === 'admin') await updateDoc(agRef(c), { apin: pin });
    else if (key === 'foreman') await updateDoc(agRef(c), { 'foreman.pin': pin });
    else { const posts = (cfg.posts || []).map(p => ('post:' + p.id === key) ? Object.assign({}, p, { pin }) : p); await updateDoc(agRef(c), { posts }); }
  } catch (e) { return alert('Could not save: ' + (e.code || e.message)); }
  alert('New PIN for ' + label + ' (Agash): ' + pin); openUsers(c);
}

const FIXED = [['admin', 'Admin'], ['head', 'Head'], ['cashier1', 'Cashier 1'], ['cashier2', 'Cashier 2']];
async function workersOf(c) {
  const path = c.id === LEGACY ? ['settings', 'workers'] : ['companies', c.id, 'settings', 'workers'];
  try { const s = await getDoc(doc(db, ...path)); return s.exists() ? (s.data().list || []) : []; } catch (e) { return []; }
}
async function allPins() {
  const all = [];
  for (const x of companies) { const p = await pinsOf(x); Object.keys(p).forEach(u => all.push({ cid: x.id, cname: x.name, u, pin: String(p[u]) })); }
  return all;
}
async function purgeUser(c, u) {   // remove a person's PIN and permissions from Firestore for good
  const base = c.id === LEGACY ? ['settings'] : ['companies', c.id, 'settings'];
  await setDoc(doc(db, ...base, 'pins'), { [u]: deleteField() }, { merge: true });
  try { await setDoc(doc(db, ...base, 'perms'), { [u]: deleteField() }, { merge: true }); } catch (e) {}
}
async function setUserPin(c, u, label) {
  const pin = (prompt('New PIN for ' + label + ' at ' + c.name + ' (4 to 6 digits, unique across all companies):', '') || '').trim();
  if (!pin) return;
  if (!/^\d{4,6}$/.test(pin)) return alert('PIN must be 4 to 6 digits.');
  const all = await allPins();
  const clash = all.find(x => x.pin === pin && !(x.cid === c.id && x.u === u));
  if (clash) return alert('That PIN is already used by ' + clash.u + ' at ' + clash.cname + '. Choose another.');
  try { await setDoc(doc(db, ...(c.id === LEGACY ? ['settings', 'pins'] : ['companies', c.id, 'settings', 'pins'])), { [u]: pin }, { merge: true }); } catch (e) { return alert('Could not save: ' + (e.code || e.message)); }
  openUsers(c);
}
async function openUsers(c) {
  const v = $('usersView'); v.style.display = 'block'; $('companies').style.display = 'none'; v.innerHTML = '';
  v.appendChild(el('div', 'padding:10px', 'Loading…'));
  const pins = await pinsOf(c), workers = await workersOf(c), all = await allPins();
  v.innerHTML = '';
  const top = el('div'); top.className = 'row'; top.style.marginBottom = '12px';
  const back = el('button', '', '← Back'); back.className = 'act'; back.onclick = () => { v.style.display = 'none'; $('companies').style.display = 'block'; };
  top.appendChild(back); top.appendChild(el('b', '', c.name + ' · Users & PINs')); v.appendChild(top);
  const rows = FIXED.slice(); const seen = new Set(FIXED.map(x => x[0]));
  workers.forEach(u => { if (!seen.has(u)) { seen.add(u); rows.push([u, u]); } });
  rows.forEach(([u, label]) => {
    const pin = pins[u] !== undefined ? String(pins[u]) : null;
    const dup = pin && all.filter(x => x.pin === pin).length > 1;
    const card = el('div'); card.className = 'card';
    const r = el('div'); r.className = 'row';
    const l = el('div'); l.appendChild(el('div', 'font-weight:600', label));
    const role = workers.includes(u) ? 'Worker' : FIXED.some(x => x[0] === u) ? 'Role' : 'Other'; const d = el('div', '', role + (dup ? ' · ⚠️ PIN used twice' : '')); d.className = 'dim'; if (dup) d.style.color = 'var(--amber)'; l.appendChild(d);
    const right = el('div', 'display:flex;align-items:center;gap:8px');
    const shown = el('span', 'font-family:monospace;font-size:16px;min-width:64px;text-align:right', pin ? '••••' : 'not set');

    const ed = el('button', '', '✏️'); ed.className = 'act'; ed.onclick = () => setUserPin(c, u, label);

    const rn = el('button', 'flex:1', '✏️ Rename'); rn.className = 'act'; rn.onclick = () => saveCompany(c.id);
    const pn = el('button', 'flex:1', '👥 Users & PINs'); pn.className = 'act'; pn.onclick = () => openUsers(c);
    const dz = el('button', 'flex:1', '🎨 Design'); dz.className = 'act'; dz.onclick = () => openDesign(c);
    btns.appendChild(rn); btns.appendChild(dz); btns.appendChild(pn); card.appendChild(btns); box.appendChild(card);
  });
  // Live
  const lv = $('live'); lv.innerHTML = '';
  const online = presence.filter(isOn).sort((a, b) => b.lastSeen - a.lastSeen);
  const h = el('div', 'margin-bottom:8px', online.length + ' online now'); h.className = 'dim'; lv.appendChild(h);
  online.forEach(p => {
    const card = el('div'); card.className = 'card';
    const r = el('div'); r.className = 'row';
    const l = el('div'); const n = el('div', 'font-weight:600'); const dot = el('span'); dot.className = 'dot'; dot.style.background = 'var(--green)'; n.appendChild(dot); n.appendChild(document.createTextNode(p.user + ' · ' + p.role)); l.appendChild(n);
    const d = el('div', '', (p.companyName || p.company) + ' · ' + (p.device || '')); d.className = 'dim'; l.appendChild(d);
    const t = el('div', '', ago(p.lastSeen)); t.className = 'dim'; r.appendChild(l); r.appendChild(t); card.appendChild(r); lv.appendChild(card);
  });
  const recent = presence.filter(p => !isOn(p)).sort((a, b) => b.lastSeen - a.lastSeen).slice(0, 8);
  if (recent.length) { const h2 = el('div', 'margin:14px 0 8px', 'Recently signed out'); h2.className = 'dim'; lv.appendChild(h2);
    recent.forEach(p => { const d = el('div', 'padding:6px 0;border-bottom:1px solid var(--line)', (p.user || '?') + ' · ' + (p.companyName || p.company) + ' · ' + ago(p.lastSeen)); d.className = 'dim'; lv.appendChild(d); }); }
  // Errors
  const er = $('errors'); er.innerHTML = '';
  if (!errors.length) { const d = el('div', '', 'No problems reported 🎉'); d.className = 'dim'; er.appendChild(d); }
  errors.forEach(e => {
    const card = el('div'); card.className = 'card err';
    card.appendChild(el('div', 'font-size:14px;word-break:break-word', e.msg));
    const d = el('div', 'margin-top:6px', (e.companyName || e.company) + ' · ' + e.user + ' · ' + e.src + ' · ' + ago(e.ts)); d.className = 'dim'; card.appendChild(d); er.appendChild(card);
  });
}
</script>
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
